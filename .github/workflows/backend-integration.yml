name: Backend integration tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: audit_test
          MARIADB_USER: audit
          MARIADB_PASSWORD: audit
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql,mbstring,curl
          coverage: none

      - name: Configure test database
        working-directory: audit-app/backend
        run: |
          cp config.example.php config.php
          php -r '$p="config.php"; $s=file_get_contents($p); $s=str_replace(["your_db_name","your_db_user","your_db_password"],["audit_test","audit","audit"],$s); file_put_contents($p,$s);'
          mariadb -h127.0.0.1 -uroot -proot audit_test < db/schema.sql
          php seed.php

      - name: Run engine smoke tests
        working-directory: audit-app/backend
        run: php tests/smoke_test.php

      - name: Start PHP API
        working-directory: audit-app/backend
        run: |
          php -S 127.0.0.1:8080 public/index.php > /tmp/audit-api.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"dbConnected":true' /tmp/health.json

      - name: Run HTTP API regression tests
        working-directory: audit-app/backend
        run: php tests/http_api_test.php http://127.0.0.1:8080

      - name: Typecheck audit-mobile
        working-directory: audit-mobile
        run: |
          npm ci
          npx tsc --noEmit
