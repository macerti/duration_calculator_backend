name: Build, test and publish deployment artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPLOY_REPO: macerti/duration_calculator
  PRODUCTION_API_URL: https://tools.macerti.com/duration_calculator/api

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: audit_test
          MARIADB_USER: audit
          MARIADB_PASSWORD: audit
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Repository hygiene checks (Work Package G)
        run: scripts/check-repo-hygiene.sh

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql,mbstring,curl
          coverage: none

      - name: Install MariaDB client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client

      - name: Verify MariaDB service
        run: |
          mariadb -h127.0.0.1 -P3306 -uaudit -paudit audit_test -e "SELECT 1"

      - name: Create CI database configuration
        working-directory: src/backend
        run: |
          cat > config.php <<'PHP'
          <?php
          return [
              'db' => [
                  'host' => '127.0.0.1',
                  'port' => 3306,
                  'name' => 'audit_test',
                  'user' => 'audit',
                  'password' => 'audit',
                  'charset' => 'utf8mb4',
              ],
              'allowedOrigins' => ['*'],
              'debug' => true,
          ];
          PHP
          php -r '$c=require "config.php"; var_export(["host"=>$c["db"]["host"],"port"=>$c["db"]["port"],"name"=>$c["db"]["name"],"user"=>$c["db"]["user"]]); echo PHP_EOL; require "db/pdo.php"; echo AuditEngine\pingDb() ? "PDO MariaDB connection: OK\n" : "PDO MariaDB connection: FAILED\n"; if (!AuditEngine\pingDb()) exit(1);'

      - name: Install schema and seed parameters
        working-directory: src/backend
        run: |
          mariadb -h127.0.0.1 -P3306 -uaudit -paudit audit_test < db/schema.sql
          php seed.php

      - name: Run PHP engine smoke tests
        working-directory: src/backend
        run: php tests/smoke_test.php

      - name: Start PHP API
        working-directory: src/backend/api
        run: |
          php -S 127.0.0.1:8080 index.php > /tmp/audit-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"dbConnected":true' /tmp/health.json

      - name: Run HTTP API regression tests
        working-directory: src/backend
        run: php tests/http_api_test.php http://127.0.0.1:8080

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: src/frontend
        run: npx tsc --noEmit

      - name: Build Expo web artifact
        working-directory: src/frontend
        env:
          EXPO_PUBLIC_API_URL: ${{ env.PRODUCTION_API_URL }}
        run: npx expo export --platform web --clear

      - name: Assemble deployment artifact
        run: |
          rm -rf _deploy
          mkdir -p _deploy
          cp -R src/frontend/dist/. _deploy/

          mkdir -p _deploy/api _deploy/data _deploy/db _deploy/engine _deploy/tests
          cp -R src/backend/api/. _deploy/api/
          cp -R src/backend/data/. _deploy/data/
          cp -R src/backend/db/. _deploy/db/
          cp -R src/backend/engine/. _deploy/engine/
          cp -R src/backend/tests/. _deploy/tests/
          cp src/backend/.htaccess _deploy/.htaccess
          cp src/backend/config.example.php _deploy/config.example.php
          cp src/backend/seed.php _deploy/seed.php

          test -f _deploy/index.html
          test -f _deploy/api/index.php
          test -f _deploy/engine/duration.php
          test -f _deploy/db/pdo.php
          test ! -e _deploy/config.php

      - name: Deployment artifact content check (Work Package G)
        run: scripts/check-deploy-artifact.sh _deploy

      - name: Checkout deployment repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.DEPLOY_REPO }}
          token: ${{ secrets.DURATION_CALCULATOR_TOKEN }}
          path: _deploy_repo
          fetch-depth: 1

      - name: Publish deployment artifact
        run: |
          rm -rf _deploy_repo/index.html _deploy_repo/_expo _deploy_repo/assets
          rm -rf _deploy_repo/api _deploy_repo/data _deploy_repo/db _deploy_repo/engine _deploy_repo/tests
          rm -f _deploy_repo/.htaccess _deploy_repo/config.example.php _deploy_repo/seed.php
          cp -R _deploy/. _deploy_repo/

          cd _deploy_repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Deployment artifact is already current."
          else
            git add -A
            git commit -m "build: publish artifact from duration_calculator_source"
            git push origin main
          fi
