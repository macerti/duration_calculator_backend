name: Build, test and publish deployment artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPLOY_REPO: macerti/duration_calculator
  PRODUCTION_API_URL: https://tools.macerti.com/duration_calculator/api

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql,mbstring,curl
          coverage: none

      - name: Set up MariaDB
        uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: 'mariadb-10.11'

      - name: Configure test database
        working-directory: audit-app/backend
        run: |
          cp config.example.php config.php
          php -r '$p="config.php"; $s=file_get_contents($p); $s=str_replace(["your_db_name","your_db_user","your_db_password"],["audit_test","root",""] ,$s); file_put_contents($p,$s);'
          mysql -uroot -e "CREATE DATABASE audit_test"
          mysql -uroot audit_test < db/schema.sql
          php seed.php

      - name: Run PHP engine tests
        working-directory: audit-app/backend
        run: php tests/smoke_test.php

      - name: Start PHP API
        working-directory: audit-app/backend
        run: |
          php -S 127.0.0.1:8080 public/index.php > /tmp/audit-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"dbConnected":true' /tmp/health.json

      - name: Run HTTP API regression tests
        working-directory: audit-app/backend
        run: php tests/http_api_test.php http://127.0.0.1:8080

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: audit-mobile/package-lock.json

      - name: Install frontend dependencies
        working-directory: audit-mobile
        run: npm ci

      - name: Typecheck frontend
        working-directory: audit-mobile
        run: npx tsc --noEmit

      - name: Build Expo web artifact
        working-directory: audit-mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ env.PRODUCTION_API_URL }}
        run: npx expo export --platform web --clear

      - name: Assemble deployment tree
        run: |
          rm -rf _deploy
          mkdir -p _deploy
          cp -R audit-mobile/dist/. _deploy/
          mkdir -p _deploy/api _deploy/data _deploy/db _deploy/engine _deploy/tests
          cp -R duration-calculator-php/api/. _deploy/api/
          cp -R duration-calculator-php/data/. _deploy/data/
          cp -R duration-calculator-php/db/. _deploy/db/
          cp -R duration-calculator-php/engine/. _deploy/engine/
          cp -R duration-calculator-php/tests/. _deploy/tests/
          cp duration-calculator-php/.htaccess _deploy/.htaccess
          cp duration-calculator-php/config.example.php _deploy/config.example.php
          cp duration-calculator-php/seed.php _deploy/seed.php
          test -f _deploy/index.html
          test -f _deploy/api/index.php
          test -f _deploy/engine/duration.php
          test -f _deploy/db/pdo.php
          test ! -e _deploy/config.php

      - name: Checkout deployment repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEPLOY_REPO }}
          token: ${{ secrets.DURATION_CALCULATOR_TOKEN }}
          path: _deploy_repo
          fetch-depth: 1

      - name: Publish deployment artifact
        run: |
          rsync -a --delete --exclude='.git/' --exclude='.github/' _deploy/ _deploy_repo/
          cd _deploy_repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Deployment artifact is already current."
          else
            git add -A
            git commit -m "build: publish artifact from duration_calculator_backend"
            git push origin main
          fi
